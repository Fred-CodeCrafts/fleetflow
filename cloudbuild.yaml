# Cloud Build: build the release image and deploy it to Cloud Run.
#
# This file is what a tag trigger runs. It does not create the trigger — that is a
# one-time step in the project, described in deploy/README.md under "Deploy on a
# tag", and it needs an open billing account before it can do anything.
#
# The image carries the git tag and the commit SHA, so a running revision can be
# matched back to the code that produced it. The manual path (deploy/deploy.ps1)
# defaults to `latest`, which cannot be matched to a commit; a tag trigger must
# not inherit that habit.

substitutions:
  _REGION: asia-southeast2
  _REPOSITORY: fleetflow
  _SERVICE: fleetflow
  _OSRM_URL: https://router.project-osrm.org

options:
  machineType: E2_HIGHCPU_8
  logging: CLOUD_LOGGING_ONLY

# The image installs SUMO from Debian packages, so a cold build is slower than a
# Go-only image. Ten minutes, the default, is not enough headroom.
timeout: 2400s

steps:
  - id: build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --tag=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/fleetflow:${TAG_NAME}
      - --tag=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/fleetflow:${COMMIT_SHA}
      - .

  - id: push-tag
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/fleetflow:${TAG_NAME}

  - id: push-commit
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/fleetflow:${COMMIT_SHA}

  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --project=${PROJECT_ID}
      - --region=${_REGION}
      - --image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/fleetflow:${TAG_NAME}
      - --platform=managed
      - --allow-unauthenticated
      - --min-instances=0
      - --max-instances=3
      - --cpu=1
      - --memory=1Gi
      - --timeout=300
      # A scenario runs in a goroutine after the request returns; throttling would
      # freeze it between requests.
      - --no-cpu-throttling
      - --set-secrets=DATABASE_URL=fleetflow-database-url:latest
      - --set-env-vars=ENV=production,LOG_LEVEL=info,OSRM_URL=${_OSRM_URL}
