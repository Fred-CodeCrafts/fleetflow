# Local development database for FleetFlow.
#
# Fleet records (vehicles, drivers, trips, saved runs, hashed API keys) live in
# PostgreSQL; live congestion state stays in memory on the single instance, so
# this service is dev-only and is never part of the deployed binary.
#
# Values come from .env (gitignored). See .env.example for the key list.
#   docker compose up -d
#   docker compose down          # keep the volume
#   docker compose down -v       # drop the data too
services:
  postgres:
    image: postgres:17-alpine
    container_name: fleetflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DATABASE}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # Consumed by scripts/db/init/01-readonly-role.sh, not by Postgres itself.
      POSTGRES_RO_USER: ${POSTGRES_RO_USER}
      POSTGRES_RO_PASSWORD: ${POSTGRES_RO_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - fleetflow-pgdata:/var/lib/postgresql/data
      - ./scripts/db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  # Applies db/migration to the database above.
  #
  # Flyway owns the schema: the service never creates or alters tables, so a
  # deployment changes the database the same way every time. Kept behind a
  # profile so `docker compose up -d` starts the database without changing it —
  # schema changes are deliberate:
  #
  #   docker compose --profile tools run --rm migrate
  #
  # Credentials come in as environment variables rather than command-line flags,
  # so they do not appear in `ps` output.
  migrate:
    image: flyway/flyway:11-alpine
    profiles: ["tools"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      FLYWAY_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DATABASE}
      FLYWAY_USER: ${POSTGRES_USER}
      FLYWAY_PASSWORD: ${POSTGRES_PASSWORD}
      FLYWAY_LOCATIONS: filesystem:/flyway/sql
      FLYWAY_CONNECT_RETRIES: "10"
    volumes:
      - ./db/migration:/flyway/sql:ro
    command: migrate

volumes:
  fleetflow-pgdata:
