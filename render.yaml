# A public URL before Cloud Run has billing. See deploy/free-hosting.md for what
# this deployment can and cannot do: the Route Planner returns 503 because there is
# no OSRM, and data resets on restart because no database is configured.
services:
  - type: web
    name: fleetflow
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    # /readyz is 503 in memory mode, so the platform must probe liveness, not
    # readiness. That is not a workaround: an instance without a database is not
    # ready to serve writes, and the app says so.
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: ENV
        value: production
      - key: LOG_LEVEL
        value: info
